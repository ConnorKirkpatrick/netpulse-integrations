name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push opnsense-pusher
        uses: docker/build-push-action@v7
        with:
          # Context is the repository root: opnsense/Dockerfile copies go.mod
          # and the module tree, so the module root must be the context.
          context: .
          file: opnsense/Dockerfile
          # Traceable version stamp (release builds embed the tag version).
          build-args: |
            VERSION=sha-${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/connorkirkpatrick/opnsense-pusher:latest
            ghcr.io/connorkirkpatrick/opnsense-pusher:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      