name: Publish

on:
  push:
    branches:
      - main

jobs:
  test:
    # Same gates as .github/workflows/test.yml; publish must not push an
    # image unless the code is green (mirrors release.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate vendor catalog
        run: python3 .github/validate_vendors.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push opnsense-pusher
        uses: docker/build-push-action@v7
        with:
          # Context is the repository root: opnsense/Dockerfile copies go.mod
          # and the module tree, so the module root must be the context.
          context: .
          file: opnsense/Dockerfile
          # Traceable version stamp (release builds embed the tag version).
          build-args: |
            VERSION=sha-${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/connorkirkpatrick/opnsense-pusher:latest
            ghcr.io/connorkirkpatrick/opnsense-pusher:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      